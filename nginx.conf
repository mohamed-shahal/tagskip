# Served by the frontend image. Mirrors public/_headers (used by static hosts)
# and proxies /api to the backend service on the compose network.

map $uri $cache_control {
    default         "no-cache";
    ~^/assets/      "public, max-age=31536000, immutable";
    ~^/profiles/    "public, max-age=31536000, immutable";
    /favicon.svg    "public, max-age=604800";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Declared once at server level so every location inherits
    # them (a location-level add_header would override this whole set).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    # API proxy. Same-origin, so the frontend needs no CORS or API base URL.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
